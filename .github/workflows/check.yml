name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows only, deliberately. This is a local music player and the packages that
# matter are the ones a Windows listener installs; the Linux and macOS jobs were
# removed rather than allowed to rot, and their packaging in
# desktopApp/build.gradle.kts is still there for whenever they are wanted back.
jobs:
  desktop-windows:
    name: Desktop · Windows · ${{ matrix.variant }}
    runs-on: windows-latest
    # A matrix rather than two builds in one job, for the same reason as in
    # release.yml: the variant is not a declared input of Compose's packaging
    # tasks, so a second build in the same workspace would hand back the first
    # variant's installer under the second's name.
    strategy:
      fail-fast: false
      matrix:
        variant: [full, local]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      # jpackage drives candle and light to build the .exe and the .msi, and
      # neither ships with a GitHub runner. The binaries are dropped rather than
      # installed, and put on PATH for the steps that follow.
      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Tests
        if: matrix.variant == 'full'
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:packagePortable "-Pbitchord.variant=${{ matrix.variant }}"

      # The installer, not just the runnable folder: a listener should be able to
      # take the artefact from this run and install it without a JDK, a toolchain
      # or a command line.
      - name: Build the installer
        run: .\gradlew.bat :desktopApp:packageExe "-Pbitchord.variant=${{ matrix.variant }}"

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/*/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: The installer was produced
        shell: bash
        run: ls -lh desktopApp/build/compose/binaries/main/exe/*.exe

      - name: The portable build was produced
        shell: bash
        run: ls -lh desktopApp/build/distributions/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-${{ matrix.variant }}-Windows-Setup
          path: desktopApp/build/compose/binaries/main/exe/*.exe

      # The same app as a folder to unzip and run: no installer, nothing in
      # Program Files, nothing to uninstall. For the listener who wants the new
      # build without installing it over the old one every time.
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-${{ matrix.variant }}-Windows-Portable
          path: desktopApp/build/distributions/*.zip

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  # Untouched for now: it is not this player's target, and fixing it is its own
  # piece of work. Left in place rather than deleted so that work has somewhere
  # to start.
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/